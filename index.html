    .nav-tab-bar{display:flex;gap:0;margin-bottom:0;background:#fff;border:1px solid #E8E5E0;border-radius:12px;overflow:hidden;}

    .nav-tab .alert-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#D94F4F;margin-left:4px;vertical-align:middle;}
    .nav-panel{display:none;padding:10px 12px;background:rgba(248,246,242,0.5);border:1px solid #E8E5E0;border-top:none;border-radius:0 0 12px 12px;margin-bottom:24px;flex-wrap:wrap;gap:6px;}
    .nav-panel.open{display:flex;}
    .nav-tab[data-tab="sales"]{--tab-color:#8BA88A;--tab-bg:rgba(139,168,138,0.08);}
    .nav-tab[data-tab="audits"]{--tab-color:#C17F4E;--tab-bg:rgba(193,127,78,0.08);}

    .nav-panel[data-panel="sales"]{--tab-color:#8BA88A;--panel-bg:rgba(139,168,138,0.04);}
    .nav-panel[data-panel="audits"]{--tab-color:#C17F4E;--panel-bg:rgba(193,127,78,0.04);}
    .nav-panel[data-panel="docs"]{--tab-color:#7A7A7A;--panel-bg:rgba(122,122,122,0.04);}
    @media print {
      @page { size: A4; margin: 15mm; }
      body * { visibility: hidden; }
      #print-doc-area, #print-doc-area * { visibility: visible; }
      #print-doc-area { position: absolute; left: 0; top: 0; width: 100%; }
      .nav-tab, .seg-btn, .filter-group, #syncBtn, .export-btn { display: none !important; }
    }

  <script>
    var _activeTab = 'sales';
    var _tabDefaults = { sales: 'overview', audits: 'auditexport', docs: 'mywork', admin: 'adminusers', shop: 'shop-home' };

    function setActiveTab(tab) {
      if (tab === _activeTab) return;
      _activeTab = tab;
      document.querySelectorAll('.nav-tab').forEach(function(t) {
        t.classList.toggle('active', t.getAttribute('data-tab') === tab);
      });
      document.querySelectorAll('.nav-panel').forEach(function(p) {
        p.classList.toggle('open', p.getAttribute('data-panel') === tab);
      });
      var defaultView = _tabDefaults[tab];
      if (defaultView && typeof setView === 'function') setView(defaultView);
    }

    function applyNavPermissions() {
      if (typeof Users === 'undefined') return;
      var user = Users.getEffectiveUser();
      if (!user) return;
      /* Use Access module for role-based filtering if available */
      if (typeof Access !== 'undefined') {
        Access.applyNavPermissions();
        return;
      }
      /* Fallback: legacy filtering */
      document.querySelectorAll('.nav-tab').forEach(function(tab) {
        var tabId = tab.getAttribute('data-tab');
        if (tabId === 'admin') {
          tab.style.display = (typeof window.isAdmin === 'function' && isAdmin()) ? '' : 'none';
          return;
        }
        var canSee = Users.canSeeTab(tabId);
        tab.style.display = canSee ? '' : 'none';
      });
      document.querySelectorAll('.nav-panel button').forEach(function(btn) {
        var onclick = btn.getAttribute('onclick') || '';
        var match = onclick.match(/setView\('([^']+)'\)/);
        if (match) {
          var viewId = match[1];
          btn.style.display = Users.canSeeView(viewId) ? '' : 'none';
        }
      });
    }
    // Apply nav permissions on page load
    if (typeof applyNavPermissions === 'function') { setTimeout(applyNavPermissions, 100); }

    // Initial tab set — view is rendered by db.js boot flow

    // PNG export for scorecards and audit views
    function exportToPNG(elementId, filename) {
      var el = document.getElementById(elementId);
      if(!el) return;
      if (typeof html2canvas === 'undefined') {
        var script = document.createElement('script');
        script.src = './html2canvas.min.js';
        script.onload = function() { doExport(el, filename); };
        document.head.appendChild(script);
      } else {
        doExport(el, filename);
      }
    }
    function doExport(el, filename) {
      var btns = el.querySelectorAll('.export-btn');
      btns.forEach(function(b) { b.style.display = 'none'; });
      html2canvas(el, { scale: 2.5, useCORS: true, backgroundColor: '#ffffff', logging: false }).then(function(canvas) {
        btns.forEach(function(b) { b.style.display = ''; });
        var link = document.createElement('a');
        link.download = filename + '.png';
        link.href = canvas.toDataURL('image/png');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      });
    }

    // Settings modal helpers
    async function doRefresh() {
      const btn = document.getElementById('syncBtn');
      const origText = btn.innerHTML;
      btn.innerHTML = '&#x21bb; Syncing...';
      btn.disabled = true;
      btn.classList.add('opacity-50','cursor-not-allowed');
      var lo = document.getElementById('loadingOverlay');
      var ls = document.getElementById('loadingStatus');
      if (lo) lo.style.display = 'flex';
      if (ls) ls.textContent = 'Refreshing data...';
        try {
            _clearCache();
            if (typeof GraphClient !== 'undefined' && GraphClient.clearCache) { try { GraphClient.clearCache(); } catch(e) {} }
            const stores = ['kpi','audits','complaints','ingest_log',
                            'area_winners_log','area_metric_winners_log','store_winners_log'];
            for (const s of stores) { try { await idbClear(s); } catch(e) {} }
            try { await idbPut('settings', { id: 'weekly_file_manifest', files: null, cachedAt: 0 }); } catch(e) {}
            if (typeof invalidateAuditCache === 'function') { try { await invalidateAuditCache(); } catch(e) {} }
        storeMap.clear(); originalStoreNames.clear();
        window.ComplaintsData = null; window.__complaintsSourceCSV = false;
        await syncData(true);
        renderDashboard();
      } catch(e) {
        console.error('[Refresh] Sync failed:', e);
        alert('Refresh failed: ' + e.message);
      } finally {
        if (lo) lo.style.display = 'none';
        btn.innerHTML = origText;
        btn.disabled = false;
        btn.classList.remove('opacity-50','cursor-not-allowed');
      }
    }
    async function clearAllData() {
      if (!confirm('This will delete ALL stored data and sign you out. Continue?')) return;
      if (!db) { alert('Database not ready.'); return; }
      await idbClear('kpi'); await idbClear('audits'); await idbClear('stores');
      await idbClear('actions'); await idbClear('settings'); await idbClear('area_winners_log');
      await idbClear('area_metric_winners_log'); await idbClear('store_winners_log');
      await idbClear('ingest_log'); await idbClear('tracker_audits'); await idbClear('eho_data');
      await idbClear('complaints'); await idbClear('questionBank'); await idbClear('training_audits');
      await idbClear('messages'); await idbClear('message_responses');
      await idbClear('my_todos'); await idbClear('my_lists'); await idbClear('my_contacts');
      await idbClear('rota_staff'); await idbClear('rota_week'); await idbClear('rota_leave');
      await idbClear('shared_views');
      _clearCache();
      storeMap.clear(); originalStoreNames.clear();
      window.ComplaintsData = null;
      // Clear login session so login screen shows on reload
      if (typeof Users !== 'undefined') {
        Users.clearCurrentUser();
        if (typeof BirdsAuth !== 'undefined' && BirdsAuth.isLoggedIn()) {
          try { BirdsAuth.logout(); } catch(e) {}
        }
      }
      document.getElementById('mainView').innerHTML = '<div class="p-20 text-center"><h2 class="text-2xl font-black outfit text-slate-800 mb-2">All Data Cleared</h2><p class="text-slate-500 mb-6">You have been signed out. <a href="#" onclick="location.reload()" style="color:#6E8E6D;font-weight:700;">Reload</a> to start fresh.</p></div>';
    }

    // Boot: auto-sync from local folder on load
    (function() {
      // Load EHO ratings
      if (typeof window.loadEHORatings === 'function') {
        window.loadEHORatings();
      }
    })();

    // Diagnostic: Test xlsx write
    window.testXlsxWrite = async function() {
      alert('Local folder write not yet implemented.');
    };
  </script>

  <script>
    // Force SW update: when new SW installs, send SKIP_WAITING and reload
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js?v=185').then(function(reg) {
        function promptUpdate() {
          if (reg.waiting) {
            console.log('[SW] New SW waiting, sending SKIP_WAITING');
            reg.waiting.postMessage({type: 'SKIP_WAITING'});
          }
        }
        promptUpdate();
        reg.addEventListener('updatefound', function() {
          if (reg.installing) {
            reg.installing.addEventListener('statechange', function() {
              if (reg.installing && reg.installing.state === 'installed') {
                promptUpdate();
              }
            });
          }
        });
        console.log('[SW] Registered ' + (reg.installing ? 'installing' : reg.active ? 'active' : 'unknown'), 'scope:', reg.scope);
      }).catch(function(err) {
        console.warn('[SW] Registration failed:', err);
      });
      // Auto-reload when new SW takes control
      var _swReloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', function() {
        if (!_swReloading) {
          _swReloading = true;
          console.log('[SW] New controller, reloading...');
          window.location.reload();
        }
      });
    }
  </script>
  <div id="loadingOverlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(251,250,246,0.95);z-index:9999;flex-direction:column;align-items:center;justify-content:center;">

    <style>@keyframes loadBar{0%{width:0%;margin-left:0}50%{width:50%;margin-left:25%}100%{width:0%;margin-left:100%}}</style>
